[package]
name = "era-core"
version = "0.1.0"
edition = "2021"
description = "Deterministic WASM life simulation kernel for Era"
authors = ["Cicada <cicada@era.local>"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.129"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-wasm-bindgen = "0.6.5"
rand = "0.10.3"
rand_xoshiro = "0.8.1"
rand_pcg = "0.10.2"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
console_error_panic_hook = { version = "0.1.7", optional = true }
tsify-next = { version = "0.5.6", default-features = false, features = ["js"] }

[features]
default = ["console_error_panic_hook"]

[dev-dependencies]
wasm-bindgen-test = "0.3.50"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
